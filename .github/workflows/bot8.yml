name: Bot regressions

on:
  pull_request:
  push:
    branches: [main, issue-19-305883210651]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: Прочее/bot8/requirements.txt
      - name: Install runtime and check dependencies
        run: python -m pip install -r Прочее/bot8/requirements.txt snowballstemmer ruff ansible-core
      - name: Test all bot versions, RAG, main loops, server, docs and deployment syntax
        run: python experiments/check_bot8.py --logs ci-logs/checks
      - name: Preserve logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-python-${{ matrix.python-version }}
          path: ci-logs/checks
